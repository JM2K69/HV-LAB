# Builds, tests and publishes HV-LAB Manager.
#  - Push a tag "vX.Y.Z" (or "vX.Y.Z-beta.1")  -> GitHub release with the zip + SHA256
#  - Run manually (Actions > Release > Run workflow) -> zip as a build artifact only (no release)
# Hardening: actions pinned by commit SHA (Dependabot keeps them current), the build job may not write to the
# repository (only the release job may); the tag name reaches scripts through the environment, never inside the
# script text. A tagged zip gets a signed build provenance attestation: gh attestation verify <zip> --repo JM2K69/HV-LAB
name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # sign the provenance attestation (Sigstore, through the workflow's OIDC identity)
      attestations: write   # store it with the repository; no write access to the code or the releases
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    outputs:
      version:    ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      name:       ${{ steps.package.outputs.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: pwsh
        env:
          REF_NAME:   ${{ github.ref_name }}
          REF_TYPE:   ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Single source: VersionPrefix in Directory.Build.props. The tag must match it:
          # v1.2.3 -> release 1.2.3 ; v1.2.3-beta.1 -> pre-release 1.2.3-beta.1 (suffix "beta.1")
          $prefix = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix.Trim()
          if ($env:REF_TYPE -eq 'tag') {
              if ($env:REF_NAME -notmatch '^v(?<num>\d+\.\d+\.\d+)(-(?<suffix>[0-9A-Za-z.-]+))?$') { throw "Tag '$env:REF_NAME' is not vX.Y.Z[-suffix]" }
              if ($Matches.num -ne $prefix) {
                  throw "Tag $env:REF_NAME does not match VersionPrefix $prefix in Directory.Build.props: update it first."
              }
              $suffix = $Matches.suffix
          } else {
              $suffix = "ci.$env:RUN_NUMBER"   # manual run: artifact only
          }
          $ver = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          "version=$ver"   >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "prerelease=$(([bool]$suffix).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $ver (assembly/file $prefix.0)"

      - name: Test
        run: dotnet test HVLab.Core.Tests/HVLab.Core.Tests.csproj -c Release

      - name: Publish (self-contained folder)
        shell: pwsh
        env:
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: dotnet publish HVLab/HVLab.csproj -p:PublishProfile=HVLab-Release "-p:VersionSuffix=$env:SUFFIX"

      - name: Package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "HV-LAB-$env:VERSION-win-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item $stage -ItemType Directory | Out-Null
          Copy-Item HVLab/publish/* $stage -Recurse
          Copy-Item Install.ps1, README.md, README.fr.md, LICENSE $stage

          # Sanity checks: the app crashes at startup without its compiled XAML
          if (-not (Test-Path "$stage/HVLab.exe")) { throw 'HVLab.exe missing from the publish output' }
          if (-not (Get-ChildItem $stage -Recurse -Filter *.xbf)) { throw 'No .xbf in the publish output' }

          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "$name.zip  $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB  sha256 $hash"
          "zip=$zip"   >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Build provenance attestation
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets: this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: HV-LAB Manager ${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ needs.build.outputs.name }}.zip
            dist/${{ needs.build.outputs.name }}.zip.sha256
          body: |
            ## Installation

            1. Téléchargez `${{ needs.build.outputs.name }}.zip` et extrayez-le.
            2. Dans un PowerShell **administrateur**, depuis le dossier extrait :
               ```powershell
               Unblock-File .\Install.ps1
               .\Install.ps1            # options : -DesktopShortcut  -EnableHyperV  -SelfSign
               ```
               L'application est copiée dans `C:\Program Files\HV-LAB`, avec un raccourci dans le menu Démarrer
               et une entrée dans Paramètres > Applications.
            3. Désinstallation : Paramètres > Applications, ou `& "C:\Program Files\HV-LAB\Install.ps1" -Uninstall`

            Vérifier que le zip vient bien de ce dépôt : `gh attestation verify ${{ needs.build.outputs.name }}.zip --repo JM2K69/HV-LAB`

            Version autonome : rien d'autre à installer (.NET 10 et Windows App SDK sont inclus).
            Prérequis : Windows 10/11 Pro, Enterprise ou Education (ou Windows Server) avec Hyper-V.
