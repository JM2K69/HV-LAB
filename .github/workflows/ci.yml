# Builds and tests every push to master and every pull request
# (release.yml only runs on tags, so without this master was never built between two releases).
name: CI

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
    paths-ignore: [ 'docs/**', '**.md' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the app (x64, warnings as errors)
        run: dotnet build HVLab/HVLab.csproj -c Release -p:Platform=x64 -warnaserror

      - name: Test
        run: dotnet test HVLab.Core.Tests/HVLab.Core.Tests.csproj -c Release

      # Install.ps1 and the other scripts must parse in the Windows PowerShell 5.1 the app runs on
      - name: Parse the PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File |
              Where-Object { $_.FullName -notmatch '\\(bin|obj|publish)\\' } |
              ForEach-Object {
                  $errors = $null
                  [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
                  foreach ($e in $errors) {
                      Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                      $failed = $true
                  }
              }
          if ($failed) { exit 1 }
          Write-Host 'All PowerShell scripts parse.'
